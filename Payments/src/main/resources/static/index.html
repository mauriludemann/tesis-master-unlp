<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RPNA Monitor — Payments</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  .header { background: #1e293b; padding: 12px 24px; display: flex; align-items: center; gap: 16px; border-bottom: 1px solid #334155; }
  .header h1 { font-size: 18px; font-weight: 600; color: #f8fafc; }
  .header .status { font-size: 12px; padding: 4px 10px; border-radius: 12px; }
  .header .status.connected { background: #065f46; color: #6ee7b7; }
  .header .status.disconnected { background: #7f1d1d; color: #fca5a5; }

  .main { display: grid; grid-template-columns: 280px 1fr 320px; height: calc(100vh - 49px); }

  /* Left panel - Events */
  .panel-left { background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; padding: 16px; }
  .panel-left h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 12px; }

  .event-group { margin-bottom: 16px; }
  .event-group-title { font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; padding-left: 4px; }

  .event-btn { display: block; width: 100%; padding: 8px 12px; margin-bottom: 4px; border: 1px solid #334155; border-radius: 6px;
    background: #0f172a; color: #cbd5e1; font-size: 12px; cursor: pointer; text-align: left; transition: all 0.15s; }
  .event-btn:hover { background: #1e40af; border-color: #3b82f6; color: #fff; }
  .event-btn:active { transform: scale(0.98); }
  .event-btn.firing { background: #1d4ed8; border-color: #60a5fa; color: #fff; animation: pulse 0.6s; }
  .event-btn .shortcut { float: right; color: #475569; font-size: 10px; font-family: monospace; }

  .uuid-input { width: 100%; padding: 6px 10px; border: 1px solid #334155; border-radius: 6px; background: #0f172a;
    color: #f8fafc; font-size: 12px; font-family: monospace; margin-bottom: 12px; }
  .uuid-input:focus { outline: none; border-color: #3b82f6; }

  .reset-btn { display: block; width: 100%; padding: 8px; border: 1px solid #991b1b; border-radius: 6px;
    background: transparent; color: #fca5a5; font-size: 12px; cursor: pointer; margin-top: 8px; }
  .reset-btn:hover { background: #991b1b; color: #fff; }

  /* Center - Network visualization */
  .panel-center { overflow: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }

  .places-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .place-card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 10px 12px;
    transition: all 0.3s; position: relative; }
  .place-card.has-token { border-color: #f59e0b; background: #1c1917; box-shadow: 0 0 12px rgba(245, 158, 11, 0.2); }
  .place-card .place-id { font-size: 10px; color: #64748b; font-family: monospace; }
  .place-card .place-name { font-size: 13px; font-weight: 500; color: #e2e8f0; margin-top: 2px; }
  .place-card .token-count { position: absolute; top: 8px; right: 10px; width: 24px; height: 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; }
  .place-card .token-count.empty { background: #1e293b; color: #475569; border: 1px solid #334155; }
  .place-card .token-count.active { background: #f59e0b; color: #0f172a; }
  .place-card .uuids { font-size: 10px; color: #f59e0b; font-family: monospace; margin-top: 4px; }

  .place-card.flash { animation: flashGreen 0.8s ease-out; }
  @keyframes flashGreen { 0% { box-shadow: 0 0 20px rgba(34,197,94,0.6); } 100% { box-shadow: none; } }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }

  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-top: 8px; }

  .transitions-grid { display: flex; flex-wrap: wrap; gap: 4px; }
  .transition-chip { padding: 3px 8px; border-radius: 4px; font-size: 10px; font-family: monospace;
    border: 1px solid #334155; background: #0f172a; color: #64748b; transition: all 0.3s; }
  .transition-chip.enabled { border-color: #22c55e; color: #22c55e; background: #052e16; }
  .transition-chip.timed { border-style: dashed; }

  /* Right panel - Log */
  .panel-right { background: #1e293b; border-left: 1px solid #334155; display: flex; flex-direction: column; }
  .panel-right h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8;
    padding: 16px 16px 8px; }
  .log-container { flex: 1; overflow-y: auto; padding: 0 16px 16px; }

  .log-entry { padding: 8px 10px; margin-bottom: 4px; border-radius: 6px; border-left: 3px solid; font-size: 12px; background: #0f172a; }
  .log-entry.event { border-color: #3b82f6; }
  .log-entry.state { border-color: #f59e0b; }
  .log-entry.action { border-color: #22c55e; }
  .log-entry.error { border-color: #ef4444; }
  .log-entry .log-time { color: #475569; font-size: 10px; font-family: monospace; }
  .log-entry .log-msg { color: #cbd5e1; margin-top: 2px; }
  .log-entry .log-detail { color: #64748b; font-size: 11px; margin-top: 2px; font-family: monospace; }
</style>
</head>
<body>

<div class="header">
  <h1>RPNA Monitor</h1>
  <span id="sseStatus" class="status disconnected">Desconectado</span>
  <span style="flex:1"></span>
  <span style="font-size:12px; color:#64748b;">Payments Microservice — Petri Net Visualizer</span>
</div>

<div class="main">
  <!-- Left: Event buttons -->
  <div class="panel-left">
    <h2>Eventos</h2>
    <label style="font-size:11px; color:#64748b;">UUID de instancia:</label>
    <div style="display:flex; gap:4px; margin-bottom:12px;">
      <input type="text" id="uuidInput" class="uuid-input" style="margin-bottom:0; flex:1;" value="" placeholder="Click Generar">
      <button class="event-btn" style="width:auto; margin:0; padding:6px 10px; white-space:nowrap; font-size:11px;" onclick="generateUUID()">Generar</button>
    </div>

    <div class="event-group">
      <div class="event-group-title">CU1 — Pago</div>
      <button class="event-btn" onclick="fireEvent('PaymentIntent')">PaymentIntent</button>
      <button class="event-btn" onclick="fireEvent('AuthenticationResult', {authenticated:true, useCase:'C1'})">Auth Exitosa (C1)</button>
      <button class="event-btn" onclick="fireEvent('AuthenticationResult', {authenticated:false})">Auth Fallida</button>
      <button class="event-btn" onclick="fireEvent('FundsValidationResult', {fundsAvailable:true})">Saldo OK</button>
      <button class="event-btn" onclick="fireEvent('FundsValidationResult', {fundsAvailable:false})">Saldo Insuficiente</button>
      <button class="event-btn" onclick="fireEvent('PaymentProcessResult')">Pago Procesado</button>
    </div>

    <div class="event-group">
      <div class="event-group-title">CU2 — Registro</div>
      <button class="event-btn" onclick="fireEvent('AuthenticationResult', {authenticated:true, useCase:'C2'})">Auth Exitosa (C2)</button>
      <button class="event-btn" onclick="fireEvent('RegistroResult', {registroExitoso:true})">Registro OK</button>
      <button class="event-btn" onclick="fireEvent('RegistroResult', {registroExitoso:false})">Registro Fallo</button>
    </div>

    <div class="event-group">
      <div class="event-group-title">CU3 — Modificar Pago</div>
      <button class="event-btn" onclick="fireEvent('AuthenticationResult', {authenticated:true, useCase:'C3'})">Auth Exitosa (C3)</button>
      <button class="event-btn" onclick="fireEvent('ModificarPagoResult', {modificarExitoso:true})">Modificar OK</button>
      <button class="event-btn" onclick="fireEvent('ModificarPagoResult', {modificarExitoso:false})">Modificar Fallo</button>
    </div>

    <div class="event-group">
      <div class="event-group-title">CU4 — Pago Programado</div>
      <button class="event-btn" onclick="fireEvent('EjecutarPagoProgramado')">Ejecutar Pago Programado</button>
    </div>

    <div class="event-group">
      <div class="event-group-title">CU6 — Reporte</div>
      <button class="event-btn" onclick="fireEvent('AuthenticationResult', {authenticated:true, useCase:'C6'})">Auth Exitosa (C6)</button>
      <button class="event-btn" onclick="fireEvent('GeneracionReporteResult', {generacionExitosa:true})">Reporte Generado OK</button>
      <button class="event-btn" onclick="fireEvent('GeneracionReporteResult', {generacionExitosa:false})">Reporte Fallo</button>
      <button class="event-btn" onclick="fireEvent('EnvioReporteResult')">Reporte Enviado</button>
    </div>

    <button class="reset-btn" onclick="resetState()">Reiniciar Red</button>
  </div>

  <!-- Center: Network state -->
  <div class="panel-center">
    <div class="section-title">Places (Marcado actual)</div>
    <div id="placesGrid" class="places-grid"></div>

    <div class="section-title">Transiciones</div>
    <div id="transitionsGrid" class="transitions-grid"></div>
  </div>

  <!-- Right: Log -->
  <div class="panel-right">
    <h2>Log de eventos</h2>
    <div id="logContainer" class="log-container"></div>
  </div>
</div>

<script>
const API_BASE = '';
let placesNames = {};
let transitionsNames = {};
let previousMarking = [];
const timedTransitionIds = new Set([5, 7, 20, 23, 27, 29, 30]);

function generateUUID() {
  const uuid = crypto.randomUUID();
  document.getElementById('uuidInput').value = uuid;
  return uuid;
}

// Load config and initial state
async function init() {
  try {
    const configRes = await fetch(API_BASE + '/v1/state/config');
    const config = await configRes.json();
    placesNames = config.mapPlacesNames || {};
    transitionsNames = config.mapTransitionsNames || {};

    renderPlaces([]);
    renderTransitions([]);

    const stateRes = await fetch(API_BASE + '/v1/state');
    const state = await stateRes.json();
    if (state.marking && state.marking.length > 0) {
      previousMarking = new Array(state.marking.length).fill(0);
      updateState(state);
    }

    connectSSE();
    addLog('state', 'Monitor iniciado', 'Conectado al microservicio Payments');
  } catch (e) {
    addLog('error', 'Error de conexion', e.message);
  }
}

function connectSSE() {
  const evtSource = new EventSource(API_BASE + '/v1/state/stream');
  const statusEl = document.getElementById('sseStatus');

  evtSource.onopen = () => {
    statusEl.textContent = 'Conectado';
    statusEl.className = 'status connected';
  };

  evtSource.addEventListener('state-change', (e) => {
    const data = JSON.parse(e.data);
    updateState(data);
  });

  evtSource.onerror = () => {
    statusEl.textContent = 'Desconectado';
    statusEl.className = 'status disconnected';
    setTimeout(() => connectSSE(), 3000);
  };
}

function updateState(state) {
  renderPlaces(state.marking || [], state.uuidMarking || {});
  renderTransitions(state.enabledTransitions || []);
  previousMarking = [...(state.marking || [])];
}

function renderPlaces(marking, uuidMarking) {
  const grid = document.getElementById('placesGrid');
  const keys = Object.keys(placesNames).sort((a, b) => parseInt(a) - parseInt(b));
  grid.innerHTML = keys.map(idx => {
    const i = parseInt(idx);
    const tokens = marking[i] || 0;
    const hasToken = tokens > 0;
    const changed = previousMarking.length > 0 && previousMarking[i] !== tokens;
    const uuids = uuidMarking && uuidMarking[idx] ? uuidMarking[idx] : [];
    const uuidStr = Array.isArray(uuids) ? uuids.join(', ') : [...(uuids || [])].join(', ');

    return `<div class="place-card ${hasToken ? 'has-token' : ''} ${changed ? 'flash' : ''}" id="place-${i}">
      <span class="place-id">P${i}</span>
      <div class="place-name">${placesNames[idx].replace('P_', '')}</div>
      <span class="token-count ${hasToken ? 'active' : 'empty'}">${tokens}</span>
      ${uuidStr ? `<div class="uuids">${uuidStr}</div>` : ''}
    </div>`;
  }).join('');
}

function renderTransitions(enabled) {
  const grid = document.getElementById('transitionsGrid');
  const keys = Object.keys(transitionsNames).sort((a, b) => parseInt(a) - parseInt(b));
  grid.innerHTML = keys.map(idx => {
    const i = parseInt(idx);
    const isEnabled = enabled[i] || false;
    const isTimed = timedTransitionIds.has(i);
    return `<span class="transition-chip ${isEnabled ? 'enabled' : ''} ${isTimed ? 'timed' : ''}" title="${transitionsNames[idx]}">
      T${i} ${transitionsNames[idx].replace('T_', '')}
    </span>`;
  }).join('');
}

async function fireEvent(eventId, metadata) {
  const uuid = document.getElementById('uuidInput').value || 'pago-001';

  const btn = event.target;
  btn.classList.add('firing');
  setTimeout(() => btn.classList.remove('firing'), 600);

  addLog('event', `Evento: ${eventId}`, `uuid=${uuid}` + (metadata ? ` | ${JSON.stringify(metadata)}` : ''));

  try {
    const body = { eventId, uuid, metadata: metadata || null };
    const res = await fetch(API_BASE + '/v1/events', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });

    if (res.ok) {
      addLog('action', `${eventId} procesado`, `HTTP ${res.status}`);
      // Refresh state as fallback if SSE is slow
      setTimeout(async () => {
        const stateRes = await fetch(API_BASE + '/v1/state');
        const state = await stateRes.json();
        updateState(state);
      }, 200);
    } else {
      const errText = await res.text();
      addLog('error', `Error procesando ${eventId}`, `HTTP ${res.status}: ${errText}`);
    }
  } catch (e) {
    addLog('error', `Error de red`, e.message);
  }
}

async function resetState() {
  if (!confirm('Reiniciar el estado de la red de Petri?')) return;
  try {
    await fetch(API_BASE + '/v1/state/reset', { method: 'POST' });
    addLog('state', 'Red reiniciada', 'El estado fue reseteado. Reinicia la app para cargar el marking inicial.');
    previousMarking = [];
    renderPlaces([]);
    renderTransitions([]);
  } catch (e) {
    addLog('error', 'Error al reiniciar', e.message);
  }
}

function addLog(type, msg, detail) {
  const container = document.getElementById('logContainer');
  const time = new Date().toLocaleTimeString('es-AR');
  const entry = document.createElement('div');
  entry.className = `log-entry ${type}`;
  entry.innerHTML = `<div class="log-time">${time}</div><div class="log-msg">${msg}</div>${detail ? `<div class="log-detail">${detail}</div>` : ''}`;
  container.prepend(entry);
  // Keep max 100 entries
  while (container.children.length > 100) container.removeChild(container.lastChild);
}

generateUUID();
init();
</script>
</body>
</html>
